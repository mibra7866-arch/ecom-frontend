<div class="bank-modal">
  <header class="bank-modal__header">
    <h2>{{ data.mode === 'create' ? 'Add Product' : 'Edit Product' }}</h2>
    <p>{{ data.mode === 'create' ? 'Create a new product for the catalog.' : 'Editing this product never changes existing orders — they keep their own snapshot.' }}</p>
  </header>

  <form [formGroup]="form" class="bank-modal__body">
    @if (errorMessage()) {
      <div class="product-form__error">{{ errorMessage() }}</div>
    }

    <label class="bank-modal__field">
      <span>Product name</span>
      <input type="text" formControlName="name" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="bank-modal__error">Product name is required</span>
      }
    </label>

    <label class="bank-modal__field">
      <span>Description</span>
      <textarea rows="3" formControlName="description" placeholder="Optional"></textarea>
    </label>

    <div class="product-form__row">
      <label class="bank-modal__field">
        <span>Actual price</span>
        <input type="number" min="0.01" step="0.01" formControlName="price" />
        @if (form.controls.price.invalid && form.controls.price.touched) {
          <span class="bank-modal__error">Enter a positive price</span>
        }
      </label>

      <label class="bank-modal__field">
        <span>Profit</span>
        <input type="number" step="0.01" formControlName="profit" />
        @if (form.controls.profit.invalid && form.controls.profit.touched) {
          <span class="bank-modal__error">Profit is required</span>
        }
      </label>
    </div>

    <label class="bank-modal__field">
      <span>Category <span class="bank-modal__optional">(optional)</span></span>
      <input type="text" formControlName="category" placeholder="e.g. Home & Kitchen" />
    </label>

    <label class="bank-modal__field">
      <span>Product image</span>
      @if (existingImageUrl && !selectedImage()) {
        <div class="product-form__current-image">
          <img [src]="existingImageUrl" alt="Current product image" (click)="openExistingImage()" />
          <span>Current image — browse below to replace it.</span>
        </div>
      }
      <app-file-upload
        [files]="selectedImage() ? [selectedImage()!] : []"
        [multiple]="false"
        accept="image/*"
        hint="Any image, up to 5 MB"
        theme="light"
        (filesSelected)="onImageSelected($event)"
        (fileRemoved)="onImageRemoved()"
      ></app-file-upload>
      @if (imageError()) {
        <span class="bank-modal__error">{{ imageError() }}</span>
      }
    </label>
  </form>

  <footer class="bank-modal__footer">
    <button type="button" class="bank-modal__btn bank-modal__btn--ghost" [disabled]="saving()" (click)="cancel()">Cancel</button>
    <button type="button" class="bank-modal__btn bank-modal__btn--solid" [disabled]="!canSave()" (click)="save()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </footer>
</div>
