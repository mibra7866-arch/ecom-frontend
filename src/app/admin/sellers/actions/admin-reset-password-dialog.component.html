<div class="action-dialog">
  <header class="action-dialog__header">
    <h2>Reset Password</h2>
    <p>Set a new login password for {{ data.sellerName }}. This replaces their current password immediately — they'll need to sign in with the new one.</p>
  </header>

  <div class="action-dialog__body">
    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <label class="action-dialog__field">
      <span>New password</span>
      <div class="action-dialog__pw">
        <input [type]="showNew() ? 'text' : 'password'" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" autocomplete="new-password" />
        <button type="button" class="action-dialog__pw-toggle" tabindex="-1" (click)="showNew.set(!showNew())">
          <mat-icon>{{ showNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (tooShort()) {
        <span class="action-dialog__error">Must be at least 8 characters</span>
      }
    </label>

    <label class="action-dialog__field">
      <span>Confirm new password</span>
      <div class="action-dialog__pw">
        <input [type]="showConfirm() ? 'text' : 'password'" [ngModel]="confirmNewPassword()" (ngModelChange)="confirmNewPassword.set($event)" autocomplete="new-password" />
        <button type="button" class="action-dialog__pw-toggle" tabindex="-1" (click)="showConfirm.set(!showConfirm())">
          <mat-icon>{{ showConfirm() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (mismatch()) {
        <span class="action-dialog__error">Passwords do not match</span>
      }
    </label>
  </div>

  <footer class="action-dialog__footer">
    <button type="button" class="action-dialog__btn action-dialog__btn--ghost" [disabled]="saving()" (click)="cancel()">Cancel</button>
    <button type="button" class="action-dialog__btn action-dialog__btn--solid" [disabled]="!canSave()" (click)="save()">
      {{ saving() ? 'Resetting…' : 'Reset Password' }}
    </button>
  </footer>
</div>
