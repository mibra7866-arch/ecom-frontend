<div class="bank-modal">
  <header class="bank-modal__header">
    <h2>Change Transaction Password</h2>
    <p>Used to authorize transactions — separate from your login password.</p>
  </header>

  <form [formGroup]="form" class="bank-modal__body">
    @if (errorMessage()) {
      <div class="bank-modal__error bank-modal__error--banner">{{ errorMessage() }}</div>
    }

    <label class="bank-modal__field">
      <span>Current transaction password</span>
      <div class="pw-field">
        <input [type]="showOld() ? 'text' : 'password'" formControlName="oldPassword" autocomplete="current-password" />
        <button type="button" class="pw-field__toggle" tabindex="-1" (click)="showOld.set(!showOld())">
          <mat-icon>{{ showOld() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (form.controls.oldPassword.hasError('required') && form.controls.oldPassword.touched) {
        <span class="bank-modal__error">Current transaction password is required</span>
      }
    </label>

    <label class="bank-modal__field">
      <span>New transaction password</span>
      <div class="pw-field">
        <input [type]="showNew() ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" />
        <button type="button" class="pw-field__toggle" tabindex="-1" (click)="showNew.set(!showNew())">
          <mat-icon>{{ showNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (form.controls.newPassword.hasError('required') && form.controls.newPassword.touched) {
        <span class="bank-modal__error">New transaction password is required</span>
      } @else if (form.controls.newPassword.hasError('minlength') && form.controls.newPassword.touched) {
        <span class="bank-modal__error">Must be at least 8 characters</span>
      }
    </label>

    <label class="bank-modal__field">
      <span>Confirm new transaction password</span>
      <div class="pw-field">
        <input [type]="showConfirm() ? 'text' : 'password'" formControlName="confirmNewPassword" autocomplete="new-password" />
        <button type="button" class="pw-field__toggle" tabindex="-1" (click)="showConfirm.set(!showConfirm())">
          <mat-icon>{{ showConfirm() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (form.controls.confirmNewPassword.hasError('required') && form.controls.confirmNewPassword.touched) {
        <span class="bank-modal__error">Please confirm your new transaction password</span>
      } @else if (form.controls.confirmNewPassword.hasError('passwordMismatch') && form.controls.confirmNewPassword.touched) {
        <span class="bank-modal__error">Passwords do not match</span>
      }
    </label>
  </form>

  <footer class="bank-modal__footer">
    <button type="button" class="bank-modal__btn bank-modal__btn--ghost" [disabled]="saving()" (click)="cancel()">Cancel</button>
    <button type="button" class="bank-modal__btn bank-modal__btn--solid" [disabled]="form.invalid || saving()" (click)="save()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </footer>
</div>
