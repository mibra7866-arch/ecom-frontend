<div class="bank-modal">
  <header class="bank-modal__header">
    <h2>Transaction Password</h2>
    <p>Used to authorize transactions — separate from your login password.</p>
  </header>

  <form [formGroup]="form" class="bank-modal__body">
    <label class="bank-modal__field">
      <span>New transaction password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.hasError('required') && form.controls.password.touched) {
        <span class="bank-modal__error">Transaction password is required</span>
      } @else if (form.controls.password.hasError('minlength') && form.controls.password.touched) {
        <span class="bank-modal__error">Must be at least 8 characters</span>
      }
    </label>

    <label class="bank-modal__field">
      <span>Confirm transaction password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.controls.confirmPassword.hasError('required') && form.controls.confirmPassword.touched) {
        <span class="bank-modal__error">Please confirm your transaction password</span>
      } @else if (form.controls.confirmPassword.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
        <span class="bank-modal__error">Passwords do not match</span>
      }
    </label>
  </form>

  <footer class="bank-modal__footer">
    <button type="button" class="bank-modal__btn bank-modal__btn--ghost" (click)="cancel()">Cancel</button>
    <button type="button" class="bank-modal__btn bank-modal__btn--solid" [disabled]="form.invalid" (click)="save()">Save</button>
  </footer>
</div>
