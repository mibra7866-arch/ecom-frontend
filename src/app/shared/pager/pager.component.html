<div class="pager">
  <span class="pager__count">{{ totalCount }} total</span>
  <div class="pager__controls">
    <button mat-icon-button [disabled]="page <= 1" (click)="previous()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <span class="pager__page">Page {{ page }} of {{ totalPages || 1 }}</span>
    <button mat-icon-button [disabled]="page >= totalPages" (click)="next()">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
